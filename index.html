function resolveTurn(a,b,aa,bb,am={},bm={},rng=Math.random){const av=a.map((v,i)=>v*(am[i]??1)),bv=b.map((v,i)=>v*(bm[i]??1));const out={damage:[0,0],mods:[{},{}],messages:[],actions:[ACTIONS[aa],ACTIONS[bb]]};const vals=[av,bv];const hit=(who,d)=>{out.damage[who]+=Math.max(0,Math.round(d));};const score=(v,k)=>v[k]+v[3]+v[4];
 if(aa<2&&bb<2){if(aa===bb){const delta=score(av,aa)-score(bv,bb);if(delta>0)hit(1,av[aa]-bv[2]);else if(delta<0)hit(0,bv[bb]-av[2]);else out.messages.push('공격 우열 동률 · 서로 상쇄');}else{hit(1,av[aa]-bv[2]);hit(0,bv[bb]-av[2]);out.messages.push('격투와 사격이 교차 · 동시 공격');}}
 else if(aa>=2&&bb>=2){out.messages.push('서로 기회를 살피고 있다.');}
 else{const at=aa<2?0:1,de=1-at,act=at===0?aa:bb,def=de===0?aa:bb,v=vals[at],w=vals[de];let prob;if(def===2)prob=clamp(100-10*(score(v,act)-score(w,2)),0,100);else prob=clamp(100-10*(score(v,act)-score(w,act)),0,100);const ok=rng()*100<prob;out.messages.push(`${de===0?'렌':'상대'} ${def===2?'방어':'회피'} ${ok?'성공':'실패'} (${Math.round(prob)}%)`);if(ok){if(def===2){const k=act===0?3:2;out.mods[at][k]=.9;out.messages.push(`다음 턴 ${at===0?'렌':'상대'} ${KEYS[k]} −10%`);}else{out.mods[de][act]=1.1;out.messages.push(`다음 턴 ${de===0?'렌':'상대'} ${KEYS[act]} +10%`);}}else hit(de,v[act]-w[2]/(def===3?2:1));}return out;}
function nextTurn(m,rng=Math.random){if(m.done)return;if(m.roundEnded){m.round++;m.turn=0;m.hp=[100,100];m.mods=[{},{}];m.roundEnded=false;}m.turn++;const r=resolveTurn(m.stats[0],m.stats[1],weightedAction(m.weights??[25,25,25,25],rng),weightedAction([25,25,25,25],rng),...m.mods,rng);m.mods=r.mods;m.hp=m.hp.map((v,i)=>Math.max(0,v-r.damage[i]));let text=`${r.actions[0]} / ${r.actions[1]} · 렌 −${r.damage[0]} HP · 상대 −${r.damage[1]} HP`;if(r.messages.length)text+=' · '+r.messages.join(' / ');if(m.turn>=40&&m.hp.every(v=>v>0)){m.hp=m.hp.map(v=>Math.max(0,v-5));text+=' · 서든데스: 양쪽 HP −5';}m.logs.unshift({round:m.round,turn:m.turn,text});m.logs=m.logs.slice(0,150);if(m.hp.some(v=>v===0)){let winner;if(m.hp[0]===m.hp[1]){winner=rng()<.5?0:1;m.logs.unshift({round:m.round,turn:m.turn,text:'동시 KO · 동률 추첨: '+(winner===0?'렌':'상대')+' 라운드 승리'});}else winner=m.hp[0]>m.hp[1]?0:1;m.score[winner]++;m.roundEnded=true;if(m.score[winner]===2){m.done=true;m.winner=winner;}}return r;}

          "text": "...본 실력이 아니었다?",
          "standings": [],
          "effects": [],
          "next": "node_9af1fffc23234c4f9efebc8143af19a6",
          "choices": []
        },
        {
          "id": "node_9af1fffc23234c4f9efebc8143af19a6",
          "speaker": "치사토",
          "text": "맞아. 우리가 본 108번의 배틀 동안,\n렌쨩은 상대의 기술을 따라잡으려고 노력해서\n초반보다 훨씬 성장했어.",
          "standings": [],
          "effects": [],
          "next": "node_c5aaca6360834c7f95ba88ae16a9ecbd",
          "choices": []
        },
        {
          "id": "node_c5aaca6360834c7f95ba88ae16a9ecbd",
          "speaker": "스미레",
          "text": "그런데 이 상대,\n초반부터 지금까지 쭉 \"한 템포 차이\"로\n렌한테 이겨왔잖아.",
          "standings": [],
          "effects": [],
          "next": "node_c0cf5adc95a94bc887b65ff144e652f2",
          "choices": []
        },
        {
          "id": "node_c0cf5adc95a94bc887b65ff144e652f2",
          "speaker": "토마리",
          "text": "그렇다면, 이 108번째 승리에서 보여준 실력도\n상대에게 있어선 렌 선배의 성장에\n\"맞춰준 레벨\"인 뿐이라는 것인가요?",
          "standings": [],
          "effects": [],
          "next": "node_be122422054e4330af33d309f9ac0e50",
          "choices": []
        },
        {
          "id": "node_be122422054e4330af33d309f9ac0e50",
          "speaker": "나츠미",
          "text": "듣기만 해도 무시무시한 거에요...",
          "standings": [],
          "effects": [],
          "next": "node_f1d0ed0dadff472ab7c15c389590aea4",
          "choices": []
        },
        {
          "id": "node_f1d0ed0dadff472ab7c15c389590aea4",
          "speaker": "렌",
          "text": "죄송합니다, 여러분...\n이런 굴욕...게이머로서 처음 겪어보는 것이라...",
          "standings": [],
          "effects": [],
          "next": "node_081aa4c38e8e42e9b37b06b5609635ad",
          "choices": []
        },
        {
          "id": "node_081aa4c38e8e42e9b37b06b5609635ad",
          "speaker": "메이",
          "text": "무리하지 않아도 돼!\n단순히 상대가 엄청나게 강했을 뿐인 거잖아?\n프로게이머라던가, 렌 선배보다 게임 잘하는 사람은 얼마든지 있고...!",
          "standings": [],
          "effects": [],
          "next": "node_b0fc6adc3afb4910a8f99015600c94ab",
          "choices": []
        },
        {
          "id": "node_b0fc6adc3afb4910a8f99015600c94ab",
          "speaker": "렌",
          "text": "감사합니다. 메이씨.\n하지만 그런 문제가 아니에요.\n",
          "standings": [],
          "effects": [],
          "next": "node_2aaf5079bf644f3a902e827570fdb9d4",
          "choices": []
        },
        {
          "id": "node_2aaf5079bf644f3a902e827570fdb9d4",
          "speaker": "쿠쿠",
          "text": "같은 상대한테 108번이나 진 게 분한 것...\n그것만이 아니란 건가요...?",
          "standings": [],
          "effects": [],
          "next": "node_f2f4c6fcd1d64ffbbecd7c4fcabad586",
          "choices": []
        },
        {
          "id": "node_f2f4c6fcd1d64ffbbecd7c4fcabad586",
          "speaker": "렌",
          "text": "네. 이 상대는 확실히 저의 성장에 맞춰서 매번 그 한 수 위를 보여줬어요.\n마치...저를 성장시키려는 것처럼...",
          "standings": [],
          "effects": [],
          "next": "node_3c7a698645a24cbcba0643dd31b06524",
          "choices": []
        },
        {
          "id": "node_3c7a698645a24cbcba0643dd31b06524",
          "speaker": "마르가레테",
          "text": "뭐? 자기보다 엄청 약한 이름모를 상대를 3시간 이상이나 상대한 게\n\"가르쳐 주려고\"라고?\n그럴 리가 없잖아. 일방적으로 괴롭히는 걸 즐기는 악질인 거겠지.",
          "standings": [],
          "effects": [],
          "next": "node_7945bd8e60ce4f5e82114df178f6821c",
          "choices": []
        },
        {
          "id": "node_7945bd8e60ce4f5e82114df178f6821c",
          "speaker": "토마리",
          "text": "마르가레테. 세상의 모든 사람들이 당신처럼\n심사가 꼬여 있을거라고 생각하는 건 안좋은 버릇입니다.",
          "standings": [],
          "effects": [],
          "next": "node_56ede41ba67f46f49849869c17dc85d7",
          "choices": []
        },
        {
          "id": "node_56ede41ba67f46f49849869c17dc85d7",
          "speaker": "마르가레테",
          "text": "하?",
          "standings": [],
          "effects": [],
          "next": "node_192478cd35b14f9fadccb829c59cd069",
          "choices": []
        },
        {
          "id": "node_192478cd35b14f9fadccb829c59cd069",
          "speaker": "렌",
          "text": "마르가레테씨 말대로 제 억측일지도 몰라요. \n그렇지만 마지막, 108번째 패배에서...\n저는 이 사람이 아쉬워했다는 느낌을 받았습니다.",
          "standings": [],
          "effects": [],
          "next": "node_02cdf275b1f249ca88d24c1382f5b54a",
          "choices": []
        },
        {
          "id": "node_02cdf275b1f249ca88d24c1382f5b54a",
          "speaker": "시키",
          "text": "Disappointed, 그것은...",
          "standings": [],
          "effects": [],
          "next": "node_ac06514d3d884603b74e7af279e61b0d",
          "choices": []
        },
        {
          "id": "node_ac06514d3d884603b74e7af279e61b0d",
          "speaker": "스미레",
          "text": "렌이 자기가 원하는 수준에 도달하지 못했다. 라고 느꼈다는 거네.",
          "standings": [],
          "effects": [],
          "next": "node_741b8567210043a0a07c08f0dacd931d",
          "choices": []
        },
        {
          "id": "node_741b8567210043a0a07c08f0dacd931d",
          "speaker": "렌",
          "text": "네. 그래서 분함을 느끼고 있습니다.\n108판이나 상대해준 사람인데 상대해준 보람이 없게 만들다니...\n이 굴욕, 어떻게 해야...",
          "standings": [],
          "effects": [],
          "next": "node_f0973c494c564bec95f993e5273a5808",
          "choices": []
        },
        {
          "id": "node_f0973c494c564bec95f993e5273a5808",
          "speaker": "나츠미",
          "text": "렌 선배답지 않게 왜 약한 소리를 하는 건가요?\n실력을 길러서 그 사람한테 다시 도전하면 되는 거에요!",
          "standings": [],
          "effects": [],
          "next": "node_fba7313d8b55495e823e207b9579526c",
          "choices": []
        },
        {
          "id": "node_fba7313d8b55495e823e207b9579526c",
          "speaker": "토마리",
          "text": "아네쟈. 그렇게 간단한 문제는 아닙니다.",
          "standings": [],
          "effects": [],
          "next": "node_407e5b1b34bf4db3a1653b2154072f48",
          "choices": []
        },
        {
          "id": "node_407e5b1b34bf4db3a1653b2154072f48",
          "speaker": "나츠미",
          "text": "낫츠?",
          "standings": [],
          "effects": [],
          "next": "node_970347b2c45d42bb9ad9d6fbde5afff8",
          "choices": []
        },
        {
          "id": "node_970347b2c45d42bb9ad9d6fbde5afff8",
          "speaker": "렌",
          "text": "이 게임, \"메탈 워즈\"는 작년 런칭 이후로 세계적인 인기를 끌어\n평일 한밤중에도 평균 2172010명의 동시 접속자 수를 유지하는 로봇 배틀 게임...",
          "standings": [],
          "effects": [],
          "next": "node_dadfed340fc84a0395b5af25a5fdd92f",
          "choices": []
        },
        {
          "id": "node_dadfed340fc84a0395b5af25a5fdd92f",
          "speaker": "메이",
          "text": "어째서 평균 접속자가 그런 구체적인 숫자로 나오는 거야",
          "standings": [],
          "effects": [],
          "next": "node_421833ed48bc4671a354c419339661ff",
          "choices": []
        },
        {
          "id": "node_421833ed48bc4671a354c419339661ff",
          "speaker": "렌",
          "text": "방금 전처럼 랭크전도 아닌 순수 랜덤 매칭으로 만난 사람은,\n친구 추가를 받아주지 않으면 아마 다시 만날 기회 같은 건\n서비스 종료까지 없을 거에요...",
          "standings": [],
          "effects": [],
          "next": "node_8f2d258b03e74985873154d63cac6a61",
          "choices": []
        },
        {
          "id": "node_8f2d258b03e74985873154d63cac6a61",
          "speaker": "치사토",
          "text": "렌쨩...",
          "standings": [],
          "effects": [],
          "next": "node_182750adc30c4fdda0d4ff1fbcc54fbe",
          "choices": []
        },
        {
          "id": "node_182750adc30c4fdda0d4ff1fbcc54fbe",
          "speaker": "키나코",
          "text": "...대회라면, 있지 않겠슴까?",
          "standings": [],
          "effects": [],
          "next": "node_e897eaa2ae4a48228df84446febc8c82",
          "choices": []
        },
        {
          "id": "node_e897eaa2ae4a48228df84446febc8c82",
          "speaker": "마르가레테",
          "text": "대회라니...이 게임의 대회 얘기하는 거야?",
          "standings": [],
          "effects": [],
          "next": "node_8aacf3f9ac9d4de79e3fc7cd7811abdb",
          "choices": []
        },
        {
          "id": "node_8aacf3f9ac9d4de79e3fc7cd7811abdb",
          "speaker": "키나코",
          "text": "그렇슴다! 저렇게 잘하는 사람이라면\n어쩌면 대회에서 볼 수 있을지도 모름다!",
          "standings": [],
          "effects": [],
          "next": "node_85f75ffca7ce4826bcd154c9ba6048ba",
          "choices": []
        },
        {
          "id": "node_85f75ffca7ce4826bcd154c9ba6048ba",
          "speaker": "토마리",
          "text": "어디...그러면 제일 유력한 것은\n\"The King of Iron Armor Tournament 202X\"네요.",
          "standings": [],
          "effects": [],
          "next": "node_66a1112784744f09ab5a3fbe1b927e15",
          "choices": []
        },
        {
          "id": "node_66a1112784744f09ab5a3fbe1b927e15",
          "speaker": "스미레",
          "text": "그런 대회명으로 괜찮은 거야?",
          "standings": [],
          "effects": [],
          "next": "node_877f81285d0145da9c12b0d1d5ba7c0e",
          "choices": []
        },
        {
          "id": "node_877f81285d0145da9c12b0d1d5ba7c0e",
          "speaker": "토마리",
          "text": "프로, 아마추어 관계없이 \"메탈 워즈\" 플레이어 모두에게 열려있는\n공식 대회라고 나와 있습니다.",
          "standings": [],
          "effects": [],
          "next": "node_7c17071fa9694ac6bbcab0d4f645986e",
          "choices": []
        },
        {
          "id": "node_7c17071fa9694ac6bbcab0d4f645986e",
          "speaker": "시키",
          "text": "방금 그 사람 정도 실력이면, 이미 출전한 적이 있을지도...\n찾았다. 보도자료에 있었어.",
          "standings": [],
          "effects": [],
          "next": "node_344804e67fcd4d908cb80433faa3b9f2",
          "choices": []
        },
        {
          "id": "node_344804e67fcd4d908cb80433faa3b9f2",
          "speaker": "키나코",
          "text": "오오! 같은 이름임다!\n어디...202X년 대회...우승자...!?",
          "standings": [],
          "effects": [],
          "next": "node_c2723127c20c4f78aba1a99137e7909c",
          "choices": []
        },
        {
          "id": "node_c2723127c20c4f78aba1a99137e7909c",
          "speaker": "렌",
          "text": "우승자라...제가 따라잡을 수 있을 리 없었네요...\n대전하게 된 것 만으로도 영광으로 삼아야...",
          "standings": [],
          "effects": [],
          "next": "node_cdb4f04898994391bd81d84df4fbc01f",
          "choices": []
        },
        {
          "id": "node_cdb4f04898994391bd81d84df4fbc01f",
          "speaker": "카논",
          "text": "...렌쨩. 나가자. 게임 대회!",
          "standings": [],
          "effects": [],
          "next": "node_e8f708a48fdf496680a9637a8401b78a",
          "choices": []
        },
        {
          "id": "node_e8f708a48fdf496680a9637a8401b78a",
          "speaker": "렌",
          "text": "카논씨?",
          "standings": [],
          "effects": [],
          "next": "node_0a1b78047db04fe7ab7c38182aefc72f",
          "choices": []
        },
        {
          "id": "node_0a1b78047db04fe7ab7c38182aefc72f",
          "speaker": "카논",
          "text": "렌쨩은 이 사람을 다시 만나서 성장한 자신을 보여주고 싶은 거잖아?\n그 마음이 진실이라면, 여기서 꺾여서는 안된다고 생각해.\n그 때, 쿠쿠쨩 덕에 내가 포기하지 않은 것처럼!",
          "standings": [],
          "effects": [],
          "next": "node_65e370ca873747b4ba43acb16566461c",
          "choices": []
        },
        {
          "id": "node_65e370ca873747b4ba43acb16566461c",
          "speaker": "쿠쿠",
          "text": "카논...그렇네요! 포기하기엔 아직 일러요!\n렌렌도 방금의 108연패로 대회에 나갈 정도 되는 실력은 갖췄을 게 틀림없어요!\n",
          "standings": [],
          "effects": [],
          "next": "node_6087f274a82f4d569530884de39d12a0",
          "choices": []
        },
        {
          "id": "node_6087f274a82f4d569530884de39d12a0",
          "speaker": "스미레",
          "text": "어쩔 수 없네. 렌이 시무룩해 있는 걸 보는 것도 기분이 영 그럴 거고.\n여기는 쇼 비지니스의 전문가인 내가 팔 걷어붙이고 도울 차례네!",
          "standings": [],
          "effects": [],
          "next": "node_8c651ee485d646e192e65691cbe03f46",
          "choices": []
        },
        {
          "id": "node_8c651ee485d646e192e65691cbe03f46",
          "speaker": "쿠쿠",
          "text": "그래놓고 저번처럼 팔도 다리도 없어서\n아무짝에도 도움 안되는 구소쿠무시가 될 게 빤히 보이네요.",
          "standings": [],
          "effects": [],
          "next": "node_dce4c9537a344a33ab3c5f8943f7bd81",
          "choices": []
        },
        {
          "id": "node_dce4c9537a344a33ab3c5f8943f7bd81",
          "speaker": "스미레",
          "text": "저번이라니! 치사토가 운석을 떨어트린 시점에서 그건 꿈 같은 무언가로 처리하는거야!",
          "standings": [],
          "effects": [],
          "next": "node_1ba73ea4747e4613b74c467c0fb49e97",
          "choices": []
        },
        {
          "id": "node_1ba73ea4747e4613b74c467c0fb49e97",
          "speaker": "나츠미",
          "text": "뭐 나가도 괜찮은 거 아닌가요? 어차피 우리는 TVA도 3기까지 마쳤겠다\n선배들처럼 몇년도를 사는지 불명인 사자에상 시공에 있으니\n시간은 차고 넘치는 거에요!",
          "standings": [],
          "effects": [],
          "next": "node_5668ef10a9834e5e8aff788a4a026b1a",
          "choices": []
        },
        {
          "id": "node_5668ef10a9834e5e8aff788a4a026b1a",
          "speaker": "토마리",
          "text": "아네쟈! 그런 얘기를 하면 세계가 붕괴할 지도 모릅니다!",
          "standings": [],
          "effects": [],
          "next": "node_a1a34b6de23043a79b5dcf928b3a8744",
          "choices": []
        },
        {
          "id": "node_a1a34b6de23043a79b5dcf928b3a8744",
          "speaker": "마르가레테",
          "text": "호들갑은. 나도 한가하니까 협력하겠어.\n다만, 내가 협력하는 이상 \"성장한 모습을 보여준다\"같은 미적지근한 목표는 용서하지 않아.\n노린다면 우승이니까!",
          "standings": [],
          "effects": [],
          "next": "node_7f1101a056eb4deb8b0539a02093e71b",
          "choices": []
        },
        {
          "id": "node_7f1101a056eb4deb8b0539a02093e71b",
          "speaker": "렌",
          "text": "여러분...!",
          "standings": [],
          "effects": [],
          "next": "node_2e8be365beb74895bfd1d7ec77e9fb39",
          "choices": []
        },
        {
          "id": "node_2e8be365beb74895bfd1d7ec77e9fb39",
          "speaker": "메이",
          "text": "뭐, 다들 달아오른 건 좋다 치는데...\n협력이라니, 뭘 어떻게 하려는 거야?",
          "standings": [],
          "effects": [],
          "next": "node_07c2a65424644be9a8c76695840989e8",
          "choices": []
        },
        {
          "id": "node_07c2a65424644be9a8c76695840989e8",
          "speaker": "일동",
          "text": "...",
          "standings": [],
          "effects": [],
          "next": "node_02f11ea230dd46b58c3fa316996b9159",
          "choices": []
        },

function openEditor(){const returnView=view;view='editor';editorCleanup=mountEditor(app,s.content,{state:s,apply:p=>{if(s.items.some(i=>!p.items[i])||s.skills.some(i=>!p.skills[i]))throw Error('현재 소지한 항목의 슬롯이 없어 적용할 수 없습니다. 기존 항목 슬롯을 유지하세요.');s.content=structuredClone(p);activeContent=s.content;},close:()=>{editorCleanup?.();editorCleanup=null;view=returnView;if(view==='day'||view==='train'||view==='outing')playEvents(eligibleEvents(s,'day'));else render();}});}
function profile(){const eff=effective(s),helpers=s.friends.map((v,i)=>v>=70?`${FRIENDS[i]} ${(v/10).toFixed(1)}%`:null).filter(Boolean);return `<aside class="sidebar"><section class="panel profile"><span class="profile-label">PLAYER 01 · ${s.cycle}회차</span><div class="name"><h2>하즈키 렌</h2><small>Liella!</small></div><div class="energy"><div class="energy-header"><span>체력</span><b>${s.energy} / 100</b></div><div class="meter" role="meter" aria-label="체력" aria-valuenow="${s.energy}" aria-valuemin="0" aria-valuemax="100"><i style="width:${s.energy}%"></i></div></div><div class="stats">${KEYS.map((k,i)=>`<div class="stat-row"><span>${k}</span><div class="meter"><i style="width:${Math.min(100,eff[i])}%"></i></div><strong title="기본 ${s.stats[i]} · 소지 효과 ${signed(eff[i]-s.stats[i])}">${eff[i]}${eff[i]!==s.stats[i]?`<span class="passive-delta">(${signed(eff[i]-s.stats[i])})</span>`:''}</strong></div>`).join('')}</div><div class="support-list">${helpers.length?'연습 도움 확률<br>'+helpers.join(' · '):'호감도 70 이상인 동료가 연습을 도와줄 수 있어요.'}</div><div class="profile-foot"><span>대회 우승</span><b>${s.wins}회 · ${s.cycle}회차</b></div></section><section class="panel inventory">${['items','skills'].map((kind,j)=>`<div class="section-heading" ${j?'style="margin-top:22px"':''}><h3>${j?'스킬':'아이템'}</h3><span>${s[kind].length} / 30</span></div>${s[kind].length?`<div class="tags">${s[kind].map(i=>`<button class="tag" data-act="gear:${kind}:${i}">${esc(s.content[kind][i].name)}</button>`).join('')}</div>`:'<p class="empty">외출과 이벤트에서 얻을 수 있어요.</p>'}`).join('')}</section></aside>`;}
function scene(text='오늘은 무엇을 해 볼까요? 꾸준히 연습하면, 분명 더 잘할 수 있을 거예요.',speaker='하즈키 렌',tag='유이가오카 · 방과 후'){return `<section class="scene"><span class="scene-tag">${esc(tag)}</span><div class="dialogue"><div class="speaker">${esc(speaker)}</div><p>${esc(text)}</p></div></section>`;}
function journal(){return `<section class="panel journal"><div class="section-heading"><h3>렌의 하루 기록</h3><span>최근 기록</span></div>${s.history.length?s.history.slice(0,3).map(x=>`<p>${esc(x)}</p>`).join(''):'<p>1일차 · 리엘라의 응원을 받으며 첫 도전을 시작했다.</p>'}</section>`;}
function dayContent(){if(eventSession)return eventContent();if(result)return `<div class="panel fade">${scene(result.quote,result.speaker||'하즈키 렌',result.tag||'오늘의 기록')}<div class="action-area result"><h3>${esc(result.title)}</h3><p>${esc(result.text)}</p><div class="reward">${result.rewards.map(t=>`<span>${esc(t)}</span>`).join('')}</div>${btn('다음 날로 →','next')}</div></div>`;
 if(s.day%10===0)return tournament();let content='';
 if(view==='train')content=`<div class="action-heading"><h3>어떤 연습을 할까요?</h3>${btn('← 돌아가기','day','back')}</div><div class="training">${[['attack','공격 연습','격투 · 사격 +3~5','각성 +2 확률 10%'],['defense','방어 연습','수비 · 반응 +3~5','각성 +2 확률 10%'],['night','철야 연습','4개 스탯 +5','각성 +4 확률 60%']].map(([id,name,gain,awak])=>`<button data-act="practice:${id}" ${s.energy<trainingCost(s,id)?'disabled':''}><span class="tiny">${id==='night'?'HIGH RISK':'TRAINING'}</span><b>${name}</b><small>${gain}<br>${awak}</small><small class="cost">필요 체력 ${trainingCost(s,id)} · 성공률 ${chance(s)}%</small></button>`).join('')}</div><p class="empty" style="margin-top:13px">표시된 스탯 상승은 기본값입니다. 소지 효과와 동료 도움으로 달라집니다. 실패 시 스탯 상승 없음. 여러 동료가 도와도 상승량 보너스는 50%이며 반올림합니다.</p>`;
 else if(view==='outing')content=`<div class="action-heading"><h3>누구와 나갈까요?</h3>${btn('← 돌아가기','day','back')}</div><div class="friend-grid">${FRIENDS.map((n,i)=>`<button class="friend-btn" data-act="out:${i}"><span class="friend-avatar" style="--friend:${colors[i]}">${n[0]}</span><b>${n}</b><small>호감도 ${s.friends[i]} / 100</small></button>`).join('')}<button class="friend-btn" data-act="out:-1"><span class="friend-avatar" style="--friend:#8e9bb1">렌</span><b>혼자 나가기</b><small>나만의 시간</small></button></div><p class="empty">동료와 외출해 아무 이벤트도 없으면 호감도가 10 오릅니다 (최대 100).</p>`;
 else content=`<div class="action-heading"><h3>오늘의 행동</h3><span>하루에 한 번 선택할 수 있어요</span></div><div class="actions"><button class="action-card" data-act="train"><span class="action-icon">✧</span><b>연습</b><small>실력을 한 단계 더<br>기본 체력 −20 / −40</small></button><button class="action-card" data-act="outing"><span class="action-icon">↗</span><b>외출</b><small>리엘라와 새로운 하루<br>기본 체력 +20</small></button><button class="action-card" data-act="rest"><span class="action-icon">☾</span><b>휴식</b><small>충분히 쉬어 가기<br>기본 체력 +40 / +80</small></button></div>`;
 return `<div class="panel fade">${scene(s.energy<30?'조금 피곤하네요…… 오늘은 충분히 쉬는 게 좋겠어요.':undefined)}<div class="action-area">${content}</div></div>`;
}
function tournament(){const final=s.day===100,name=final?'The King of Iron Armor Tournament':'제'+Math.floor(s.day/10)+'회 게임 대회',stage=final?(s.finalStage===3?'결승 · SASUKE':`본선 ${s.finalStage+1} / 3`):'2선승제';if(!match)return `<div class="panel fade">${scene(final?'이제 마지막 대회예요. 모두와 함께 쌓은 실력을, 마지막까지 보여드릴게요!':'드디어 대회 날이네요. 지금까지 쌓아 온 실력을 보여 드리겠습니다!','하즈키 렌',stage)}<div class="action-area result"><h3>${name}</h3><p>${final?'서로 다른 상대 3명을 모두 이기면 결승에서 SASUKE와 대결합니다. 각 상대와 2선승제로 겨룹니다.':'매 턴 두 선수가 무작위로 행동합니다. 라운드 HP는 100. 먼저 두 라운드를 이기면 우승합니다.'}</p>${final?`<div class="final-banner">${stage}<br>SASUKE · 격투 150 / 사격 150 / 수비 150 / 반응 150 / 각성 100</div>`:''}<div class="reward"><span>2선승제</span><span>자동 전투</span><span>소지 효과 자동 적용</span></div>${btn(final&&s.finalStage?'다음 상대와 대결하기':'대회 참가하기','battle-start')}</div></div>`;
 const m=match;return `<section class="panel battle"><div class="battle-heading"><h3>${name}</h3><span class="round">ROUND ${m.round} · TURN ${m.turn}</span></div>${final?`<div class="final-banner">${stage} · ${esc(m.opponent)}</div>`:''}<div class="score">${m.score[0]} <span style="color:#b4bfd2;padding:0 20px">:</span> ${m.score[1]}</div><div class="arena">${[0,1].map(i=>`${i?'<div class="versus">VS</div>':''}<div class="fighter ${i?'enemy':''}"><h3>${i?esc(m.opponent):'하즈키 렌'}</h3><div class="hp"><span>HP</span><b>${m.hp[i]} / 100</b></div><div class="meter"><i style="width:${m.hp[i]}%"></i></div><div class="battle-stats">${KEYS.map((k,j)=>`${k} ${m.stats[i][j]}`).join(' · ')}</div></div>`).join('')}</div><div class="battle-status" aria-live="polite">${m.done?(m.winner===0?'✦ '+(final&&s.finalStage<3?'이 상대에게 승리했습니다!':'대회 우승!'):'이번 대회는 여기까지. 다시 도전할 수 있어요.'):(m.roundEnded?'라운드 종료 · 다음 라운드를 준비합니다.':m.logs[0]?esc(m.logs[0].text.split(' · ').slice(0,3).join(' · ')):'두 선수가 경기를 준비하고 있습니다.')}</div><div class="battle-controls">${m.done?btn(m.winner!==0?'재도전 준비하기':final?(s.finalStage===3?'최종 우승 결과 보기':'다음 대결 준비하기'):'우승! 다음 날로 →','battle-finish'):btn(speed===650?'빠르게 보기 ×4':'보통 속도 ×1','speed','small-btn')+btn('이 대결의 결과 보기','skip','small-btn')}</div><div class="probabilities">렌의 선택 확률: ${m.weights.map((v,i)=>`${BATTLE_NAMES[i]} ${(v/m.weights.reduce((a,b)=>a+b,0)*100).toFixed(1)}%`).join(' · ')}</div><div class="section-heading"><h3>전투 기록</h3><span>렌 / 상대 행동</span></div><div class="battle-log">${m.logs.length?m.logs.map(l=>`<div class="log-line"><b>R${l.round} · T${l.turn}</b>${esc(l.text)}</div>`).join(''):'<p class="empty">대회가 곧 시작됩니다.</p>'}</div><p class="empty" style="margin-top:13px">육성 체력과 대회 HP는 별도입니다. 각 라운드마다 HP가 초기화됩니다.</p></section>`;
}
function endingContent(){const champion=view==='champion',items=champion?s.items.filter(i=>s.content.items[i].inherit):s.items,skills=champion?s.skills.filter(i=>s.content.skills[i].inherit):[];return `<section class="panel gameover"><span class="eyebrow">${champion?'THE CHAMPION':'TRY AGAIN'}</span><h2>${champion?'우승자, 하즈키 렌!':'끝이 아닌, 다음 시작.'}</h2><p>${champion?'The King of Iron Armor Tournament<br>세 명의 도전자와 SASUKE를 모두 이겼습니다!<br>계승 가능한 소지품을 가지고 '+(s.cycle+1)+'회차를 시작할 수 있습니다.':s.day+'일차 대회에서 아쉽게 패배했습니다.<br>지금까지 모은 아이템을 가지고 다시 시작할 수 있습니다.'}</p><div class="tags" style="justify-content:center">${items.map(i=>`<span class="tag">${esc(s.content.items[i].name)}</span>`).join('')}${skills.map(i=>`<span class="tag">${esc(s.content.skills[i].name)} · 스킬</span>`).join('')||''}</div><p class="empty">계승 아이템 ${items.length}개 · 스킬 ${skills.length}개</p><div class="buttons">${btn(champion?`${s.cycle+1}회차 계승 데이터 다운로드`:'계승 세이브 저장',champion?'champion-save':'inherit-save')}${btn(champion?'계승하고 새 회차 시작':'아이템을 갖고 재도전',champion?'champion-retry':'retry','secondary')}</div><p class="empty">${champion?'‘2회차 계승 가능’으로 설정된 소지 아이템·스킬만 계승합니다.':'패배 시 아이템만 모두 계승하며 스킬은 초기화됩니다.'}<br>기본 스탯·호감도·우승 기록·이벤트 발생 기록은 초기화됩니다.<br>제작 콘텐츠와 스탠딩은 그대로 유지됩니다.</p></section>`;}
function render(){if(view==='editor')return;if(view==='title'){app.innerHTML=`<main class="title-screen fade"><div class="topline"><div class="brand"><span class="star">✦</span> Liella! AFTER SCHOOL</div><span class="edition">FANMADE TRAINING SIMULATION</span></div><div class="title-content"><div class="eyebrow">REN'S GAMING DAYS</div><h1>겜 장인<br><span>렌쨩</span><span style="color:#79a5ec;font-size:.6em">✦</span></h1><p class="title-description">방과 후, 렌의 새로운 도전.<br>리엘라와 함께 게임 대회의 정상으로!</p><div class="title-buttons">${btn('<span>새 게임 시작</span><span>＋</span>','new')}${btn('<span>저장 파일 불러오기</span><span>↗</span>','load','secondary')}</div></div><footer class="title-footer"><span>러브 라이브! 슈퍼스타!! 비공식 팬게임</span><span>겜 장인 렌쨩 · v2.0</span></footer></main>`;return;}
 if(view==='intro'){app.innerHTML=`<div class="shell"><header class="header"><h2><span class="star">✦</span> 겜 장인 렌쨩</h2><span class="tiny">DAY 01 · ${s.cycle}회차</span></header></div><main class="intro-wrap fade"><div class="panel">${scene(lines[intro][1],lines[intro][0],'1일차 · 리엘라의 부실')}<div class="intro-controls"><small>${intro+1} / ${lines.length}</small>${btn(intro===lines.length-1?'렌의 첫날 시작하기 →':'다음 대화 →','intro-next')}</div></div></main>`;return;}
 const busy=!!result||!!match||!!eventSession,dayIn=(s.day-1)%10+1,base=s.day-dayIn;app.innerHTML=`<div class="shell"><header class="header"><h2><span class="star">✦</span> 겜 장인 렌쨩</h2><div class="header-actions">${btn('소지품 관리','inventory','small-btn',busy)}${btn('게임 규칙','rules','small-btn')}${btn('저장','save','small-btn',busy)}${btn('타이틀','title-prompt','small-btn',!!match&&!match.done)}</div></header><div class="daybar"><div class="day-label"><strong>${String(s.day).padStart(2,'0')}일차</strong><span>${s.day===100?'최종 대회':s.day%10===0?'오늘은 게임 대회!':'다음 대회까지 '+(10-dayIn)+'일'}</span></div><div class="calendar" aria-label="대회 일정">${Array.from({length:10},(_,i)=>`<span class="${i+1===dayIn?'active':i+1<dayIn?'past':i===9?'tournament':''}">${i===9?'★':base+i+1}</span>`).join('')}</div></div><main class="layout">${profile()}<div class="main">${view==='lost'||view==='champion'?endingContent():dayContent()}${journal()}</div></main><footer class="footer">비공식 팬게임 · v2.0 · 제작 콘텐츠와 진행 상황은 저장 파일로 보관해 주세요.</footer></div>`;
}
const statRewards=gains=>gains.flatMap((v,i)=>v?[KEYS[i]+' '+signed(v)]:[]);
function doPractice(kind){const events=eligibleEvents(s,kind),r=practice(s,kind),name={attack:'공격 연습',defense:'방어 연습',night:'철야 연습'}[kind];record(name+' '+(r.success?'성공':'실패')+(r.helpers.length?' · '+r.helpers.map(i=>FRIENDS[i]).join(', ')+'의 도움':''));result={title:name+' '+(r.success?'성공!':'실패'),text:r.success?'반복하던 동작이 손에 익기 시작했습니다. 오늘의 노력이 실력이 되었습니다.':'마음처럼 잘 풀리지 않는 날도 있죠. 이번에는 능력치가 오르지 않았습니다.',quote:r.success?'방금 보셨나요? 이번에는 제대로 해냈어요!':'앗…… 다음에는 컨디션을 더 잘 챙겨야겠어요.',rewards:[`체력 ${signed(r.energy)}`,...statRewards(r.gains),...(r.helpers.length?[r.helpers.map(i=>FRIENDS[i]).join('·')+'의 도움 · 상승량 +50%']:[])]};playEvents(events);}
function doRest(){const events=eligibleEvents(s,'rest'),r=rest(s);record((r.bonus?'푹 잤다!':'휴식')+' · 체력 '+signed(r.gain));result={title:r.bonus?'깊고 달콤한 휴식!':'잠시, 쉬어 가는 시간',text:r.bonus?'30% 확률의 숙면에 성공했습니다. 기본 회복량이 두 배가 됩니다.':'따뜻한 차 한 잔과 함께 충분히 쉬었습니다.',quote:'충분히 쉬고 나니 머리가 맑아졌어요.',rewards:[`체력 ${signed(r.gain)}`,...statRewards(r.gains)],tag:'렌의 집 · 휴식'};playEvents(events);}
function doOut(friend){const events=eligibleEvents(s,'outing',friend),r=outing(s,friend,Math.random,events.length>0),name=friend<0?'혼자':FRIENDS[friend]+'과',e=friend<0?['익숙한 거리를 천천히 걸으며 나만의 시간을 보냈다.','가끔은 이렇게 혼자 생각을 정리하는 것도 좋네요.']:eventLines[friend];record(`${name} 외출 · ${r.reward||(events.length?'특별한 대화':'산책')} · 체력 ${signed(r.gain)}`);result={title:r.type==='item'?'새로운 아이템 발견!':r.type==='skill'?'새로운 스킬을 배웠어요!':r.type==='friend'?'한 걸음 더 가까워진 우리':name+' 보내는 오후',text:r.type==='quiet'?'특별한 사건 없이 편안한 산책을 즐겼습니다. '+e[0]:e[0],quote:r.type==='quiet'?'느긋하게 걸으니 기분이 좋아졌어요.':e[1],speaker:r.type==='quiet'||friend<0?'하즈키 렌':FRIENDS[friend],rewards:[`체력 ${signed(r.gain)}`,...(r.reward?[r.reward+' 획득']:[]),...(r.affection?[FRIENDS[friend]+' 호감도 '+signed(r.affection)]:[]),...statRewards(r.gains)],tag:'외출 · '+(friend<0?'혼자만의 시간':FRIENDS[friend]+'과 함께')};playEvents(events);}
function stop(){if(timer){clearTimeout(timer);timer=null;}}
function tick(){stop();if(!match||match.done)return;nextTurn(match);render();if(!match.done)timer=setTimeout(tick,speed);}
function beginBattle(){if(match)return;match=createMatch(s);render();timer=setTimeout(tick,speed);}
function skip(){stop();let count=0;while(!match.done&&count++<1000)nextTurn(match);render();}
function finishBattle(){const won=match.winner===0,opponent=match.opponent;record(opponent+' 대결 '+(won?'승리':'패배'));const outcome=settleMatch(s,match);match=null;if(outcome==='lost'||outcome==='champion'){view=outcome;render();}else if(outcome==='nextOpponent'){view='day';render();}else enterDay();}
function inventory(){showDialog(`<h2>소지품 관리</h2><p>아이템·스킬은 각각 30개까지 소지합니다. 가득 차면 추가 획득은 취소됩니다. 필요 없는 항목을 버리면 다음 획득을 위한 자리를 만들 수 있습니다.</p>${['items','skills'].map(k=>`<h3>${k==='items'?'아이템':'스킬'} · ${s[k].length}/30</h3><div class="discard-list">${s[k].map(i=>`<div class="discard-row"><span>${esc(s.content[k][i].name)}</span>${btn('버리기','discard:'+k+':'+i,'small-btn danger')}</div>`).join('')||'<p>소지한 항목이 없습니다.</p>'}</div>`).join('')}`);}
function gear(kind,i){const d=s.content[kind][i];showDialog(`<h2>${esc(d.name)}</h2><p>${esc(d.desc)}</p><ul>${d.effects.map(e=>`<li>${esc(effectDescription(e))}</li>`).join('')||'<li>기능 없음</li>'}</ul><p>소지 중 자동 적용 · 2회차 계승 ${d.inherit?'가능':'불가'}</p>`);}
function rules(){showDialog(`<h2>겜 장인 렌쨩 · v2 규칙</h2><h3>육성과 동료</h3><p>1일차 대화 후 하루에 한 번 행동합니다. 10일마다 대회가 열리며 100일차가 마지막입니다. 기본 체력은 최대 100. 공격·방어 연습은 20, 철야는 40을 소모합니다. 성공률은 25 + 현재 체력 × 0.7 (반올림)에 소지 보너스를 더하고 0~100%로 제한합니다.</p><p>공격 성공: 격투·사격 각각 +3~5. 방어 성공: 수비·반응 각각 +3~5. 각성은 연습 성공 시 10% 확률로 +2. 철야 성공: 나머지 4개 스탯 각각 +5, 각성은 60% 확률로 +4. 연습 실패 시 스탯 상승이 없습니다.</p><p>휴식 기본 회복은 40이며 30% 확률로 80입니다. 외출은 기본 체력 +20. 동료와 함께 외출해 아무 이벤트도 없으면 호감도 +10 (최대 100). 호감도 70 이상인 동료는 성공한 연습마다 각각 <b>(호감도 ÷ 10)%</b> 확률로 돕습니다. 한 명 이상 도우면 양수 스탯 상승량이 <b>50% 증가</b>하고 정수로 반올림합니다. 여러 명의 도움은 중첩되지 않습니다.</p><h3>외출 이벤트</h3><p>조건에 맞는 사용자 외출 이벤트가 있으면 기본 무작위 이벤트를 대체합니다. 기본 무작위 이벤트: 아이템 25%, 스킬 15%, 호감도 35%, 산책 25%. 아이템·스킬 목록에 미소지 후보가 없거나 한도가 가득 차면 산책이 됩니다. 혼자 외출의 호감도 구간도 산책입니다. 호감도 이벤트는 +15 및 동료별 스탯 +2입니다.</p><h3>전투 판정 · 2선승제</h3><p>일반 상대의 5개 스탯 평균은 10일차 20, 20일차 30으로 대회마다 10씩 증가합니다. 100일차 본선 상대 3명은 각각 평균 110이며, SASUKE는 기존 고정 스탯을 사용합니다. 매 라운드 양쪽 HP는 100으로 초기화되며, 먼저 두 라운드를 이기면 상대에게 승리합니다. 육성 체력은 대회 HP와 별도입니다. 기본 행동 확률은 격투·사격·수비·회피 각 25%이며 렌의 소지품 기능으로 조정됩니다.</p><p>A는 공격자, D는 방어자입니다. 피해는 최소 0으로 반올림하고 확률은 0~100%로 제한합니다. 성공으로 얻는 보너스·불이익은 바로 다음 한 턴에만 적용됩니다.</p><ul><li><b>격투 / 격투:</b> 격투+반응+각성이 낮은 쪽이 상대 격투−자신 수비만큼 피해를 받습니다.</li><li><b>사격 / 사격:</b> 사격+반응+각성이 낮은 쪽이 상대 사격−자신 수비만큼 피해를 받습니다.</li><li><b>격투 / 수비:</b> 성공률 = 100−10×[(A격투+A반응+A각성)−(D수비+D반응+D각성)]%. 성공 시 무피해, 다음 턴 A반응 −10%. 실패 시 A격투−D수비 피해.</li><li><b>사격 / 수비:</b> 위 식에서 A격투를 A사격으로 바꿉니다. 성공 시 다음 턴 A수비 −10%. 실패 시 A사격−D수비 피해.</li><li><b>격투 / 회피:</b> 성공률 = 100−10×[(A격투+A반응+A각성)−(D격투+D반응+D각성)]%. 성공 시 무피해, 다음 턴 D격투 +10%. 실패 시 A격투−D수비÷2 피해.</li><li><b>사격 / 회피 (변경):</b> 성공률 = 100−10×[(A사격+A반응+A각성)−(D사격+D반응+D각성)]%. 성공 시 무피해, 다음 턴 D사격 +10%. 실패 시 A사격−D수비÷2 피해.</li></ul><p>격투 / 사격은 각각 공격 스탯−상대 수비만큼 동시 공격합니다. 수비·회피끼리는 피해가 없습니다. 동일 공격의 점수 동률은 상쇄합니다. 40턴부터 양쪽 HP가 매 턴 추가로 5 감소하며 동시 KO는 50:50 추첨으로 승자를 정합니다.</p><h3>100일차 · The King of Iron Armor Tournament</h3><p>서로 다른 무작위 상대 3명과 순서대로 2선승제 대결을 치릅니다. 모두 승리하면 결승에서 <b>SASUKE (격투·사격·수비·반응 150, 각성 100)</b>와 2선승제로 대결합니다. 중간에 패하면 탈락합니다. 결승까지 이기면 최종 우승이며 101일차로 넘어가지 않습니다. 상대 사이에는 저장할 수 있습니다.</p><h3>콘텐츠 제작실</h3><p>행동 선택 전 상단 ‘콘텐츠 제작실’을 누르세요. 일자 범위(같은 날짜로 지정하면 특정 하루), 행동, 동료 호감도 범위, 아이템·스킬 소지 또는 미소지를 조합합니다. 조건은 모두 충족해야 합니다. 행동 조건은 행동 직전에 판정하고, 행동 결과 뒤에 대화를 재생합니다. 하루 시작 이벤트는 행동 전에 재생되며 하루를 소모하지 않습니다.</p><p>선택지마다 다음 대화와 효과를 지정할 수 있습니다. 각 대화 도착 시 효과, 선택지 효과, 이벤트 종료 공통 효과를 따로 설정할 수 있습니다. 스탯·호감도·체력 증감, 아이템·스킬 획득/소실을 지원합니다. 한 회차 한 번 또는 하루 한 번 반복을 선택합니다. 대화 순환은 허용하지 않습니다. 발생 시점에 조건을 만족한 이벤트들을 목록 순서대로 실행합니다.</p><p>스탠딩은 파일을 등록한 뒤 대화마다 왼쪽·중앙·오른쪽 중 하나에 배치합니다. 미리보기의 효과는 실제 게임에 반영되지 않습니다. ‘게임에 적용’을 누른 내용만 게임에서 사용됩니다. 콘텐츠 파일을 내보내면 이미지까지 함께 보관할 수 있습니다.</p><h3>아이템과 스킬 · 각각 30개 소지</h3><p>소지 중 스탯 보너스, 행동 시 스탯·체력 증감량 보정, 대회 행동 가중치, 연습 성공률을 직접 설정할 수 있습니다. 같은 대상의 효과는 합산하며 실제 계산식은 제작실에 표시됩니다. 스탯 표시에는 소지 중 보너스도 포함됩니다. 이벤트에서 소실하거나 소지품 관리에서 버리면 해당 소지 효과도 사라집니다.</p><p>대회 행동 가중치는 각각 max(0, 25+보정 합계)로 계산한 뒤 전체 합계로 나눕니다. 전부 0이면 각각 25%로 복구합니다. 한도에 도달한 상태에서 추가 보상은 획득하지 못하며 결과에 표시됩니다. ‘소지품 관리’에서 미리 자리를 만들 수 있습니다.</p><h3>저장과 계승</h3><p>‘저장’은 현재 진행, 제작한 콘텐츠, 스탠딩을 모두 포함합니다. 자동 저장은 없습니다. 행동 결과·대화·전투 도중에는 저장과 편집이 제한됩니다. 종료 전에 파일을 저장하세요. 이전 v1 저장도 읽을 수 있으며 100일 이후 데이터는 최종 대회 직전으로 변환됩니다.</p><p>패배 계승: 모든 소지 아이템을 유지하고 스킬은 초기화합니다. 최종 우승 후 새 회차 계승: <b>2회차 계승 가능</b>으로 설정한 소지 아이템과 스킬만 유지합니다. 기본 스탯·호감도·우승 기록·이벤트 발생 기록은 초기화되며 콘텐츠와 스탠딩은 유지됩니다.</p><p>비공식 팬게임입니다. 등장인물과 원작의 권리는 각 권리자에게 있습니다.</p>`);}
function act(action){try{
 if(action==='new')return start();if(action==='load')return load();if(action==='close')return modal.close();
 if(action==='intro-next'){if(view!=='intro')return;if(++intro>=lines.length){s.phase='day';return enterDay();}return render();}
 if(!s||view==='editor')return;
 if(action==='rules')return rules();
 if(action==='title-prompt')return showDialog(`<h2>타이틀로 돌아갈까요?</h2><p>저장하지 않은 진행 상황은 사라집니다. 제작 콘텐츠는 이 창에서 새 게임을 시작할 때 유지됩니다. 브라우저를 닫으면 사라지니 파일로 저장하세요.</p>${btn('계속 플레이','close','secondary')} ${btn('타이틀로 돌아가기','title')}`);
 if(action==='title'){modal.close();return title();}
 if(action.startsWith('gear:')){const [,kind,id]=action.split(':');return gear(kind,+id);}
 if(eventSession){if(action==='event-finish'&&eventSession.run.done){record(eventSession.run.notes.join(' · ')||'대화를 마쳤다.');return startNextEvent();}if(action.startsWith('event-choice:')&&!eventSession.run.done){advanceEvent(s,eventSession.run,Number(action.split(':')[1]));return render();}return;}
 if(match){if(action==='speed'){speed=speed===650?160:650;return render();}if(action==='skip')return skip();if(action==='battle-finish'&&match.done)return finishBattle();return;}
 if(result){if(action==='next')return nextDay();return;}
 if(action==='save')return save();if(action==='editor')return openEditor();if(action==='inventory')return inventory();
 if(action.startsWith('discard:')){const [,kind,id]=action.split(':');if(!confirm(s.content[kind][+id].name+'을(를) 버릴까요?'))return;s[kind]=s[kind].filter(i=>i!==+id);record('소지품 소실 · '+s.content[kind][+id].name);modal.close();render();return inventory();}
 if(action==='inherit-save'&&view==='lost')return save('retry');if(action==='retry'&&view==='lost')return start(inheritGame(s));
 if(action==='champion-save'&&view==='champion')return save('champion');if(action==='champion-retry'&&view==='champion')return start(inheritGame(s,true));
 if(view==='lost'||view==='champion')return;
 if(action==='battle-start'&&s.day%10===0)return beginBattle();if(s.day%10===0)return;
 if(['day','train','outing'].includes(action)){view=action;return render();}
 if(action.startsWith('practice:'))return doPractice(action.split(':')[1]);if(action.startsWith('out:'))return doOut(+action.split(':')[1]);if(action==='rest')return doRest();
 }catch(e){toast(e.message);}}
document.addEventListener('click',e=>{const button=e.target.closest('button[data-act]');if(button&&!button.disabled)act(button.dataset.act);});
window.addEventListener('beforeunload',e=>{if(s){e.preventDefault();e.returnValue='';}});
if(document.modelContext?.registerTool){try{Promise.resolve(document.modelContext.registerTool({name:'get_ren_game_state',title:'렌의 현재 상태',description:'현재 일차, 스탯, 체력, 소지품, 이벤트와 대회 진행 상황을 읽습니다.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true},execute(input){if(!input||Object.keys(input).length)throw Error('입력값이 필요하지 않습니다.');return {view,state:s?{day:s.day,cycle:s.cycle,phase:s.phase,energy:s.energy,stats:effective(s),friends:s.friends,items:s.items.map(i=>s.content.items[i].name),skills:s.skills.map(i=>s.content.skills[i].name),finalStage:s.finalStage}:null,event:eventSession?{event:eventSession.run.event,node:eventSession.run.node,done:eventSession.run.done}:null,battle:match?{opponent:match.opponent,hp:match.hp,score:match.score,done:match.done}:null};}})).catch(()=>{});}catch{}}
render();

return {};
})();
})();</script></body></html>
